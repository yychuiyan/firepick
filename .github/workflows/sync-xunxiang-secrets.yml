name: TEMP Sync XunXiang secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install libsodium binding
        run: python3 -m pip install --quiet pynacl

      - name: Seal secrets for XunXiang repository
        env:
          TARGET_PUBLIC_KEY: M3YitRHPbSdh/Zz3VoWwjuG3mYYAsliYnpMZEQJO/y0=
          TARGET_KEY_ID: "3380204578043523366"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sealed-xunxiang-secrets"
          python3 <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from nacl import encoding, public

          repository_key = public.PublicKey(
              os.environ["TARGET_PUBLIC_KEY"].encode("utf-8"),
              encoding.Base64Encoder(),
          )
          sealed_box = public.SealedBox(repository_key)
          names = (
              "CLOUDFLARE_API_TOKEN",
              "TENCENTCLOUD_SECRET_ID",
              "TENCENTCLOUD_SECRET_KEY",
          )
          output = {
              "key_id": os.environ["TARGET_KEY_ID"],
              "secrets": {},
          }
          for name in names:
              value = os.environ.get(name, "")
              if not value:
                  raise SystemExit(f"Missing source secret: {name}")
              encrypted = sealed_box.encrypt(value.encode("utf-8"))
              output["secrets"][name] = base64.b64encode(encrypted).decode("ascii")

          destination = (
              Path(os.environ["RUNNER_TEMP"])
              / "sealed-xunxiang-secrets"
              / "secrets.json"
          )
          destination.write_text(json.dumps(output, indent=2) + "\n")
          PY

      - name: Upload encrypted values
        uses: actions/upload-artifact@v4
        with:
          name: xunxiang-sealed-secrets
          path: ${{ runner.temp }}/sealed-xunxiang-secrets/secrets.json
          retention-days: 1
